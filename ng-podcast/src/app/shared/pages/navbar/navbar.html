<!-- src/app/shared/pages/navbar/navbar.html -->
<nav class="np-navbar">

  <!-- Logo — toujours visible -->
  <a routerLink="/" class="np-brand">
    <span class="np-brand-icon">🎙</span>
    ng-podcast
  </a>

  <!-- ─── CONNECTÉ : liens complets ─────────────────────── -->
  @if (auth.isLogged()) {
    <div class="np-nav-links">
      <a routerLink="/podcasts"
         routerLinkActive="active"
         class="np-nav-link">
         Podcasts
      </a>
      <a routerLink="/search"
         routerLinkActive="active"
         class="np-nav-link">
         Rechercher
      </a>
      <a routerLink="/writing"
         routerLinkActive="active"
         class="np-nav-link">
         Écriture
      </a>
      <a routerLink="/storytelling"
         routerLinkActive="active"
         class="np-nav-link">
         Storytelling
      </a>
    </div>

    <div class="np-nav-actions">
      <!-- Toggle dark/light -->
      <button class="np-theme-toggle"
        [class.dark]="theme.isDark()"
        (click)="theme.toggle()"
        [title]="theme.isDark() ? 'Mode clair' : 'Mode sombre'">
        <span class="np-toggle-thumb"
          [class.dark]="theme.isDark()">
        </span>
      </button>
      <span class="np-theme-icon">
        {{ theme.isDark() ? '' : '' }}
      </span>

      <!-- Mon espace -->
      <a routerLink="/podcasts/my-podcasts"
         class="btn-np-outline">
        Mon espace
      </a>

      <!-- Déconnexion -->
      <button class="btn-np-ghost" (click)="logout()">
        Déconnexion
      </button>
    </div>

  <!-- ─── NON CONNECTÉ : navbar minimale ────────────────── -->
  } @else {
    <div class="np-nav-links">
      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="np-nav-link">
        Accueil
      </a>
    </div>

    <div class="np-nav-actions">
      <!-- Toggle dark/light -->
      <button class="np-theme-toggle"
        [class.dark]="theme.isDark()"
        (click)="theme.toggle()"
        [title]="theme.isDark() ? 'Mode clair' : 'Mode sombre'">
        <span class="np-toggle-thumb"
          [class.dark]="theme.isDark()">
        </span>
      </button>
      <span class="np-theme-icon">
        {{ theme.isDark() ? '' : '' }}
      </span>

      <a routerLink="/login" class="btn-np-outline">
        Connexion
      </a>
      <a routerLink="/signup" class="btn-np">
        S'inscrire
      </a>
    </div>
  }

</nav>
