  <div class="min-h-screen flex items-center justify-center bg-slate-50">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">Connexion</h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700">Email</label>
            <input formControlName="email" type="email" class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700">Mot de passe</label>
            <input formControlName="password" type="password" class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid" class="w-full mt-8 bg-indigo-600 text-white py-2 rounded-lg font-bold disabled:bg-slate-300 transition">
          Se connecter
        </button>

        <p class="mt-4 text-center text-sm text-slate-600">
          Pas encore de compte ? <a class="text-indigo-600 font-medium cursor-pointer">S'inscrire</a>
        </p>
      </form>
    </div>
