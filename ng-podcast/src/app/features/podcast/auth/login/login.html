<div class="np-auth-wrap">
  <div class="np-auth-card glass-strong">

    <div class="np-auth-logo">
      <span class="np-gradient-text" i18n>ng-podcast</span>
    </div>

    <h2 class="np-auth-title" i18n> Welcome back</h2>
    <p class="np-text-muted np-auth-subtitle" i18n>
      Connect to your account to create and manage your podcasts, access your dashboard and more.
    </p>

    <div class="np-field">
      <label class="np-label" i18n>Email</label>
      <input class="np-input" type="email"
        placeholder="your@email.com"
        [formControl]="loginForm.controls.email"
      />
    </div>

    <div class="np-field">
      <label class="np-label" i18n>Password</label>
      <div class="np-input-password">
        <input class="np-input"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="••••••••"
          [formControl]="loginForm.controls.password"
        />
        <button type="button" class="np-input-eye"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" i18n>
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>
    </div>

    <div class="np-auth-options">
      <label class="np-checkbox-label">
        <input type="checkbox" style="accent-color:var(--np-primary)">
        <span i18n>Remember me</span>
      </label>
      <a routerLink="/resetpassword" class="np-auth-link" i18n>
        Forgot password?
      </a>
    </div>

    @if (error()) {
      <div class="np-alert np-alert-danger">{{ error() }}</div>
    }
    @if (info()) {
      <div class="np-alert np-alert-success">{{ info() }}</div>
    }

    <button class="btn-np np-auth-submit"
      [disabled]="loginForm.invalid || loading()"
      (click)="onSubmit()">
      @if (loading()) {
        <span class="np-spinner-sm"></span> Connexion...
      } @else {
        <span i18n>Sign in</span>
      }
    </button>

    <div class="np-auth-separator">
      <span i18n>or</span>
    </div>

    <app-google-signin-button
      text="signin_with"
      (credential)="onGoogleCredential($event)"
    />

    <p class="np-auth-footer">
      Pas encore de compte ?
      <a routerLink="/signup" class="np-auth-link" i18n>Sign up</a>
    </p>

  </div>
</div>
