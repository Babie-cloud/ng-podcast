<div class="np-auth-wrap">
  <div class="np-auth-card glass-strong">

    <div class="np-auth-logo">
      <span class="np-gradient-text">ng-podcast</span>
    </div>

    <h2 class="np-auth-title">Bon retour</h2>
    <p class="np-text-muted np-auth-subtitle">
      Connectez-vous pour accéder à votre espace créatif.
    </p>

    <div class="np-field">
      <label class="np-label">Email</label>
      <input class="np-input" type="email"
        placeholder="votre@email.com"
        [formControl]="loginForm.controls.email"
      />
    </div>

    <div class="np-field">
      <label class="np-label">Mot de passe</label>
      <div class="np-input-password">
        <input class="np-input"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="••••••••"
          [formControl]="loginForm.controls.password"
        />
        <button type="button" class="np-input-eye"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
          {{ showPassword ? 'Masquer' : 'Afficher' }}
        </button>
      </div>
    </div>

    <div class="np-auth-options">
      <label class="np-checkbox-label">
        <input type="checkbox" style="accent-color:var(--np-primary)">
        Se souvenir de moi
      </label>
      <a routerLink="/resetpassword" class="np-auth-link">
        Mot de passe oublié ?
      </a>
    </div>

    @if (error()) {
      <div class="np-alert np-alert-danger">{{ error() }}</div>
    }

    <button class="btn-np np-auth-submit"
      [disabled]="loginForm.invalid || loading()"
      (click)="onSubmit()">
      @if (loading()) {
        <span class="np-spinner-sm"></span> Connexion...
      } @else {
        Se connecter
      }
    </button>

    <div class="np-auth-separator">
      <span>ou</span>
    </div>

    <p class="np-auth-footer">
      Pas encore de compte ?
      <a routerLink="/signup" class="np-auth-link">S'inscrire</a>
    </p>

  </div>
</div>
