<!-- src/app/features/auth/pages/signin/signin.html -->
<div class="np-auth-wrap">
  <div class="np-auth-card glass-strong">

    <div class="np-auth-logo">
      <span class="np-gradient-text" i18n>ng-podcast</span>
    </div>

    <h2 class="np-auth-title" i18n>Create an account</h2>
    <p class="np-text-muted np-auth-subtitle" i18n>
      Join the community of content creators.
    </p>

    <div class="np-fields-row">
      <div class="np-field">
        <label class="np-label" i18n>Name *</label>
        <input class="np-input" type="text"
          placeholder="Dupont"
          [formControl]="loginForm.controls.name"
        />
      </div>
      <div class="np-field">
        <label class="np-label" i18n>First name *</label>
        <input class="np-input" type="text"
          placeholder="Marie"
          [formControl]="loginForm.controls.prenom"
        />
      </div>
    </div>

    <div class="np-field">
      <label class="np-label" i18n>Email *</label>
      <input class="np-input" type="email"
        placeholder="votre@email.com"
        [formControl]="loginForm.controls.email"
      />
    </div>

    <div class="np-field">
      <label class="np-label" i18n>Password *</label>
      <input class="np-input" type="password"
        placeholder="••••••••"
        [formControl]="loginForm.controls.password"
      />
    </div>

    <div class="np-field">
      <label class="np-label" i18n>Confirm password *</label>
      <input class="np-input" type="password"
        placeholder="••••••••"
        [formControl]="loginForm.controls.confirmPassword"
      />
    </div>

    @if (error()) {
      <div class="np-alert np-alert-danger">{{ error() }}</div>
    }

    <button class="btn-np np-auth-submit"
      [disabled]="loginForm.invalid || loading()"
      (click)="onSubmit()">
      @if (loading()) {
        <span class="np-spinner-sm"></span> Creating...
      } @else {
        <span i18n>Create account</span>
      }
    </button>

    <p class="np-auth-footer" i18n>
       By creating an account, you agree to our
       <a href="/terms" target="_blank" i18n>Terms of Service</a>
       and
       <a href="/privacy" target="_blank" i18n>Privacy Policy</a>.
    </p>
    <p class="np-auth-footer" i18n>
      Already have an account?
      <a routerLink="/login" class="np-auth-link" i18n>Sign in</a>
    </p>

  </div>
</div>
