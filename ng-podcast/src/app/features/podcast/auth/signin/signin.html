<!-- src/app/features/auth/pages/signin/signin.html -->
<div class="np-auth-wrap">
  <div class="np-auth-card glass-strong">

    <div class="np-auth-logo">
      <span class="np-gradient-text">ng-podcast</span>
    </div>

    <h2 class="np-auth-title">Créer un compte</h2>
    <p class="np-text-muted np-auth-subtitle">
      Rejoignez la communauté des créateurs de contenu.
    </p>

    <div class="np-fields-row">
      <div class="np-field">
        <label class="np-label">Nom *</label>
        <input class="np-input" type="text"
          placeholder="Dupont"
          [formControl]="loginForm.controls.name"
        />
      </div>
      <div class="np-field">
        <label class="np-label">Prénom *</label>
        <input class="np-input" type="text"
          placeholder="Marie"
          [formControl]="loginForm.controls.prenom"
        />
      </div>
    </div>

    <div class="np-field">
      <label class="np-label">Email *</label>
      <input class="np-input" type="email"
        placeholder="votre@email.com"
        [formControl]="loginForm.controls.email"
      />
    </div>

    <div class="np-field">
      <label class="np-label">Mot de passe *</label>
      <input class="np-input" type="password"
        placeholder="••••••••"
        [formControl]="loginForm.controls.password"
      />
    </div>

    <div class="np-field">
      <label class="np-label">Confirmer le mot de passe *</label>
      <input class="np-input" type="password"
        placeholder="••••••••"
        [formControl]="loginForm.controls.confirmPassword"
      />
    </div>

    @if (error()) {
      <div class="np-alert np-alert-danger">{{ error() }}</div>
    }

    <button class="btn-np np-auth-submit"
      [disabled]="loginForm.invalid || loading()"
      (click)="onSubmit()">
      @if (loading()) {
        <span class="np-spinner-sm"></span> Création...
      } @else {
        Créer mon compte
      }
    </button>

    <p class="np-auth-footer">
      Déjà un compte ?
      <a routerLink="/login" class="np-auth-link">Se connecter</a>
    </p>

  </div>
</div>
