<div class="np-auth-wrap">
  <div class="np-auth-card glass-strong">

    <div class="np-auth-logo">
      <span class="np-gradient-text" i18n>ng-podcast</span>
    </div>

    <h2 class="np-auth-title" i18n>Forgot password?</h2>
    <p class="np-text-muted np-auth-subtitle" i18n>
      Enter your email — we'll send you a reset link.
    </p>

    <div class="np-field">
      <label class="np-label" i18n>Email</label>
      <input class="np-input" type="email"
        placeholder="your@email.com"
        [formControl]="email"
      />
    </div>

    @if (sent()) {
      <div class="np-alert np-alert-success" i18n>
        Email sent. Check your inbox.
      </div>
    }

    @if (error()) {
      <div class="np-alert np-alert-danger" i18n>{{ error() }}</div>
    }

    <button class="btn-np np-auth-submit"
      [disabled]="loading()"
      (click)="onSubmit()">
      @if (loading()) {
        <span class="np-spinner-sm"></span> Send...
      } @else {
        <span i18n>Send link</span>
      }
    </button>

    <p class="np-auth-footer">
      <a routerLink="/login" class="np-auth-link" i18n>Return to login</a>
    </p>

  </div>
</div>
