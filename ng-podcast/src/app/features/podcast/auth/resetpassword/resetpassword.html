<div class="np-auth-wrap">
  <div class="np-auth-card glass-strong">

    <div class="np-auth-logo">
      <span class="np-gradient-text">ng-podcast</span>
    </div>

    <h2 class="np-auth-title">Mot de passe oublié</h2>
    <p class="np-text-muted np-auth-subtitle">
      Entrez votre email — nous vous enverrons un lien de réinitialisation.
    </p>

    <div class="np-field">
      <label class="np-label">Email</label>
      <input class="np-input" type="email"
        placeholder="votre@email.com"
        [formControl]="email"
      />
    </div>

    @if (sent()) {
      <div class="np-alert np-alert-success">
        Email envoyé. Vérifiez votre boîte mail.
      </div>
    }

    @if (error()) {
      <div class="np-alert np-alert-danger">{{ error() }}</div>
    }

    <button class="btn-np np-auth-submit"
      [disabled]="loading()"
      (click)="onSubmit()">
      @if (loading()) {
        <span class="np-spinner-sm"></span> Envoi...
      } @else {
        Envoyer le lien
      }
    </button>

    <p class="np-auth-footer">
      <a routerLink="/login" class="np-auth-link">Retour à la connexion</a>
    </p>

  </div>
</div>
