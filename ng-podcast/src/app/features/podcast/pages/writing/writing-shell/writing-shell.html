<div class="np-page np-section">
  <div class="np-hero glass-card mb-4">
    <p class="np-hero-eyebrow" i18n>Writing</p>
    <h1 class="np-gradient-text" i18n>Poems & texts</h1>
    <p class="np-hero-desc mb-0" i18n>
      Publish your writings or browse the texts published by the community.
    </p>
  </div>

  <nav class="np-subnav glass-card mb-4" aria-label="Writing">
    <a
      routerLink="/writing"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="np-subnav-link"
      >Discover</a
    >
    <a routerLink="/writing/mine" routerLinkActive="active" class="np-subnav-link"
      >My texts</a
    >
    <a routerLink="/writing/create" routerLinkActive="active" class="np-subnav-link"
      >New</a
    >
  </nav>

  <router-outlet />
</div>
