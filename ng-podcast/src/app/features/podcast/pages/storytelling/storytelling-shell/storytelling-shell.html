<div class="np-page np-section">
  <div class="np-hero glass-card mb-4">
    <p class="np-hero-eyebrow">Storytelling</p>
    <h1 class="np-gradient-text">Témoignages & histoires</h1>
    <p class="np-hero-desc mb-0">
      Partagez une confession, une expérience ou un témoignage — seuls les récits publiés sont
      visibles ici pour tout le monde.
    </p>
  </div>

  <nav class="np-subnav glass-card mb-4" aria-label="Storytelling">
    <a
      routerLink="/storytelling"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="np-subnav-link"
      >Découvrir</a
    >
    <a routerLink="/storytelling/mine" routerLinkActive="active" class="np-subnav-link"
      >Mes histoires</a
    >
    <a routerLink="/storytelling/create" routerLinkActive="active" class="np-subnav-link"
      >Nouveau</a
    >
  </nav>

  <router-outlet />
</div>
