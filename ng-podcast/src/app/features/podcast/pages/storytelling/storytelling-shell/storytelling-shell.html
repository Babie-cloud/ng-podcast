<div class="np-page np-section">
  <div class="np-hero glass-card mb-4">
    <p class="np-hero-eyebrow" i18n>Storytelling</p>
    <h1 class="np-gradient-text" i18n>Share your story</h1>
    <p class="np-hero-desc mb-0" i18n>
      Write and share your experiences, thoughts, or anecdotes with the community. Whether it's a
      personal story, a reflection, or a creative piece, your voice matters.  
    </p>
  </div>

  <nav class="np-subnav glass-card mb-4" aria-label="Storytelling">
    <a
      routerLink="/storytelling"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="np-subnav-link"
      i18n>Discover</a
    >
    <a routerLink="/storytelling/mine" routerLinkActive="active" class="np-subnav-link" i18n>
      My Stories
    </a>
    <a routerLink="/storytelling/create" routerLinkActive="active" class="np-subnav-link" i18n>
      New Story
    </a>
  </nav>

  <router-outlet />
</div>
