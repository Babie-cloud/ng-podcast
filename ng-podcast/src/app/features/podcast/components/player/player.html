@if (store.currentEpisode(); as episode) {
  <div class="np-player">

    <div class="np-player-left">
      <p class="np-player-title">{{ episode.title }}</p>
      <p class="np-player-author">{{ audio.timeLabel() }}</p>
    </div>

    <div class="np-player-center">
      <app-waveform class="np-player-wave" />
      <div class="np-seek-bar" (click)="onSeekClick($event)">
        <div class="np-seek-buffered" [style.width.%]="audio.buffered()"></div>
        <div class="np-seek-progress" [style.width.%]="audio.progress()"></div>
      </div>
    </div>

    <div class="np-player-right">
      <select class="np-rate-select"
        [value]="audio.playbackRate()"
        (change)="onRateChange($event)">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1">1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>

      <button class="np-player-btn"
        (click)="audio.skipBackward()"
        aria-label="Reculer de 15 secondes">
        −15s
      </button>

      <button class="np-player-btn np-player-btn-main"
        (click)="togglePlay()"
        [attr.aria-label]="store.isPlaying() ? 'Pause' : 'Lecture'">
        {{ store.isPlaying() ? 'Pause' : 'Lecture' }}
      </button>

      <button class="np-player-btn"
        (click)="audio.skipForward()"
        aria-label="Avancer de 15 secondes">
        +15s
      </button>

      <button class="np-player-btn"
        (click)="audio.toggleMute()"
        [attr.aria-label]="audio.state().muted ? 'Activer le son' : 'Couper le son'">
        {{ audio.state().muted ? 'Muet' : 'Son' }}
      </button>

      <input type="range" min="0" max="1" step="0.05"
        class="np-volume-slider"
        [value]="audio.volume()"
        (input)="onVolumeChange($event)"
        aria-label="Volume"
      />
    </div>

    @if (audio.loading()) {
      <div class="np-player-loader">
        <div class="np-spinner-sm"></div>
      </div>
    }

    @if (audio.error()) {
      <p class="np-player-error">{{ audio.error() }}</p>
    }

  </div>
}
