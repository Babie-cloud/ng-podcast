@if (store.currentEpisode(); as episode) {
  <div class="np-player">

    <div class="np-player-left" i18n>
      <a
        class="np-player-title-link np-player-title mb-1 d-block"
        [routerLink]="['/podcasts', episode.podcastId, 'episode', episode.id]"
       i18n>{{ episode.title }}</a>
      <p class="np-player-author mb-0" i18n>{{ audio.timeLabel() }}</p>
    </div>

    <div class="np-player-center">
      <app-waveform class="np-player-wave" />
      <div class="np-seek-bar" role="presentation" (click)="onSeekClick($event)">
        <div class="np-seek-buffered" [style.width.%]="audio.buffered()"></div>
        <div class="np-seek-progress" [style.width.%]="audio.progress()"></div>
      </div>
    </div>

    <div class="np-player-right">
      <select class="np-rate-select"
        [value]="audio.playbackRate()"
        aria-label="Vitesse de lecture"
        (change)="onRateChange($event)">
        <option value="0.5" >0.5×</option>
        <option value="0.75" >0.75×</option>
        <option value="1">1×</option>
        <option value="1.25" >1.25×</option>
        <option value="1.5" >1.5×</option>
        <option value="2">2×</option>
      </select>

      <button type="button" class="np-player-btn-icon"
        (click)="audio.skipBackward()"
        aria-label="Go back 15 seconds"
        title="−15 s" i18n>
        <i class="fa-solid fa-backward-fast" aria-hidden="true"></i>
      </button>

      <button type="button" class="np-player-btn-main"
        (click)="togglePlay()"
        [attr.aria-label]="store.isPlaying() ? 'Pause' : 'Play'">
        @if (store.isPlaying()) {
          <i class="fa-solid fa-pause fa-lg" aria-hidden="true"></i>
        } @else {
          <i class="fa-solid fa-play fa-lg" aria-hidden="true"></i>
        }
      </button>

      <button type="button" class="np-player-btn-icon"
        (click)="audio.skipForward()"
        aria-label="Advance by 15 seconds"
        title="+15 s" i18n>
        <i class="fa-solid fa-forward-fast" aria-hidden="true"></i>
      </button>

      <button type="button" class="np-player-btn-icon"
        (click)="audio.toggleMute()"
        [attr.aria-label]="audio.state().muted ? 'Activate sound' : 'Mute sound'">
        @if (audio.state().muted) {
          <i class="fa-solid fa-volume-xmark" aria-hidden="true"></i>
        } @else {
          <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
        }
      </button>

      <input type="range" min="0" max="1" step="0.05"
        class="np-volume-slider"
        [value]="audio.volume()"
        (input)="onVolumeChange($event)"
        aria-label="Volume"
        i18n />
    </div>

    @if (audio.loading()) {
      <div class="np-player-loader">
        <div class="np-spinner-sm" i18n>Loading...</div>
      </div>
    }

    @if (audio.error()) {
      <p class="np-player-error">{{ audio.error() }}</p>
    }

  </div>
}
