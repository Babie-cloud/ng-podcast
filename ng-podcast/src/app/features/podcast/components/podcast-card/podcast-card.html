<article class="np-podcast-card">

  <div class="np-cover-wrap">
    <a [routerLink]="['/podcasts', podcast.id]">
      <img
        [src]="podcast.coverUrl"
        [alt]="podcast.title"
        loading="lazy"
      />
    </a>
    <div class="np-cover-overlay">
      <button
        class="np-cover-play"
        (click)="firstEpisode && onPlay(firstEpisode)"
        [disabled]="!firstEpisode"
        [attr.aria-label]="isCurrentlyPlaying ? 'Pause' : 'Lecture'"
      >
        {{ isCurrentlyPlaying ? 'Pause' : 'Lecture' }}
      </button>
    </div>
  </div>

  <div class="np-card-body">
    <span class="np-badge np-badge-primary mb-2">
      {{ podcast.episodes.length }}
      {{ podcast.episodes.length > 1 ? 'épisodes' : 'épisode' }}
    </span>

    <h3 class="np-card-title">{{ podcast.title }}</h3>
    <p class="np-card-author">par {{ podcast.authorName }}</p>
    <p class="np-card-desc">{{ podcast.description }}</p>
    <p class="np-card-meta">
      {{ podcast.createdAt | date:'dd/MM/yyyy' }}
    </p>

    <div class="np-card-actions">
      <a class="btn-np" [routerLink]="['/podcasts', podcast.id]">
        Voir les épisodes
      </a>
      @if (firstEpisode) {
        <button class="btn-np-outline" (click)="onPlay(firstEpisode)">
          {{ isCurrentlyPlaying ? 'Pause' : 'Écouter' }}
        </button>
      }
    </div>
  </div>

</article>
